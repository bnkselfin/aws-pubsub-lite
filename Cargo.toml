[package]
name = "aws-pubsub-lite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
aws-config = "1.8.15"
aws-credential-types = "1.2.14"
aws-sdk-sns = "1.98.0"
aws-sdk-sqs = "1.97.0"
dotenv = "0.15.0"
futures = "0.3.32"
regex = "1.12.3"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = {version = "1.51.1", features = ["rt-multi-thread", "macros"] }
tokio-retry = "0.3.0"
tokio-util = "0.7.16"
tracing = "0.1.41"

[dev-dependencies]
tokio = {version = "1.51.1", features = ["signal", "time"] }
