[package]
name = "aws-pubsub-lite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
aws-config = "1.8.6"
aws-credential-types = "1.2.6"
aws-sdk-sns = "1.85.0"
aws-sdk-sqs = "1.84.0"
dotenv = "0.15.0"
futures = "0.3.31"
regex = "1.11.2"
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = {version = "1.47.1", features = ["rt-multi-thread", "macros"] }
tokio-retry = "0.3.0"
tokio-util = "0.7.16"
tracing = "0.1.41"

[dev-dependencies]
tokio = {version = "1.47.1", features = ["signal", "time"] }
